<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Business intelligence dashboard with KPI tiles, a bar chart and a donut breakdown">
  <defs>
    <linearGradient id="pb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131519"/>
      <stop offset="1" stop-color="#08090B"/>
    </linearGradient>
    <pattern id="pb-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <radialGradient id="pb-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C6A667" stop-opacity=".18"/>
      <stop offset="1" stop-color="#C6A667" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#pb-bg)"/>
  <rect width="1200" height="750" fill="url(#pb-grid)"/>
  <circle cx="600" cy="375" r="340" fill="url(#pb-glow)"/>

  <g font-family="ui-monospace,'JetBrains Mono',monospace">
    <g>
      <rect x="96" y="136" width="316" height="130" rx="12" fill="#0E0F12" stroke="#33363D"/>
      <text x="126" y="176" font-size="12" letter-spacing="2.2" fill="#6E7076">REVENUE</text>
      <text x="126" y="228" font-size="40" fill="#E8E6E1">4.82M</text>
      <text x="126" y="252" font-size="12" fill="#C6A667">▲ 12.4%</text>
    </g>
    <g>
      <rect x="442" y="136" width="316" height="130" rx="12" fill="#0E0F12" stroke="#33363D"/>
      <text x="472" y="176" font-size="12" letter-spacing="2.2" fill="#6E7076">ACTIVE USERS</text>
      <text x="472" y="228" font-size="40" fill="#E8E6E1">38.1K</text>
      <text x="472" y="252" font-size="12" fill="#C6A667">▲ 6.8%</text>
    </g>
    <g>
      <rect x="788" y="136" width="316" height="130" rx="12" fill="#0E0F12" stroke="#C6A667" stroke-opacity=".45"/>
      <text x="818" y="176" font-size="12" letter-spacing="2.2" fill="#C6A667">MARGIN</text>
      <text x="818" y="228" font-size="40" fill="#E8E6E1">31.6%</text>
      <text x="818" y="252" font-size="12" fill="#7C808A">▼ 1.2%</text>
    </g>
  </g>

  <g transform="translate(96 300)">
    <rect x="0" y="0" width="662" height="314" rx="12" fill="#0E0F12" stroke="#33363D"/>
    <text x="30" y="42" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="12" letter-spacing="2.2" fill="#6E7076">QUARTERLY PERFORMANCE</text>
    <g stroke="#26292F">
      <line x1="30" y1="96" x2="632" y2="96"/>
      <line x1="30" y1="152" x2="632" y2="152"/>
      <line x1="30" y1="208" x2="632" y2="208"/>
    </g>
    <line x1="30" y1="256" x2="632" y2="256" stroke="#3A3D44"/>
    <g>
      <rect x="60" y="164" width="44" height="92" rx="4" fill="#4A4D55"/>
      <rect x="112" y="132" width="44" height="124" rx="4" fill="#C6A667" fill-opacity=".55"/>
      <rect x="186" y="146" width="44" height="110" rx="4" fill="#4A4D55"/>
      <rect x="238" y="108" width="44" height="148" rx="4" fill="#C6A667" fill-opacity=".55"/>
      <rect x="312" y="120" width="44" height="136" rx="4" fill="#4A4D55"/>
      <rect x="364" y="82" width="44" height="174" rx="4" fill="#C6A667" fill-opacity=".55"/>
      <rect x="438" y="100" width="44" height="156" rx="4" fill="#4A4D55"/>
      <rect x="490" y="60" width="44" height="196" rx="4" fill="#C6A667"/>
    </g>
    <g font-family="ui-monospace,'JetBrains Mono',monospace" font-size="12" fill="#6E7076">
      <text x="82" y="282" text-anchor="middle">Q1</text>
      <text x="208" y="282" text-anchor="middle">Q2</text>
      <text x="334" y="282" text-anchor="middle">Q3</text>
      <text x="460" y="282" text-anchor="middle">Q4</text>
    </g>
  </g>

  <g transform="translate(788 300)">
    <rect x="0" y="0" width="316" height="314" rx="12" fill="#0E0F12" stroke="#33363D"/>
    <text x="30" y="42" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="12" letter-spacing="2.2" fill="#6E7076">BY SEGMENT</text>
    <g transform="translate(158 168)" fill="none" stroke-width="30">
      <circle cx="0" cy="0" r="72" stroke="#26292F"/>
      <circle cx="0" cy="0" r="72" stroke="#C6A667" stroke-dasharray="192 452" transform="rotate(-90)"/>
      <circle cx="0" cy="0" r="72" stroke="#7C808A" stroke-dasharray="122 452" stroke-dashoffset="-192" transform="rotate(-90)"/>
      <circle cx="0" cy="0" r="72" stroke="#4A4D55" stroke-dasharray="78 452" stroke-dashoffset="-314" transform="rotate(-90)"/>
    </g>
    <text x="158" y="176" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="24" fill="#E8E6E1">42%</text>
    <g font-family="ui-monospace,'JetBrains Mono',monospace" font-size="12" fill="#9BA0A9">
      <circle cx="38" cy="272" r="5" fill="#C6A667"/><text x="54" y="277">Retail</text>
      <circle cx="140" cy="272" r="5" fill="#7C808A"/><text x="156" y="277">B2B</text>
      <circle cx="222" cy="272" r="5" fill="#4A4D55"/><text x="238" y="277">Other</text>
    </g>
  </g>

  <g font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" letter-spacing="2.4" fill="#6E7076">
    <text x="56" y="76">POWER BI · KPI REPORTING</text>
    <text x="1144" y="702" text-anchor="end">DAX · MODELING</text>
  </g>
</svg>
