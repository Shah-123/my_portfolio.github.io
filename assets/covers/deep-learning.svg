      <rect x="14" y="-108" width="88" height="236" rx="4"/>
      <rect x="28" y="-98" width="88" height="236" rx="4" fill="#171C23"/>
    </g>
    <text x="58" y="164" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" letter-spacing="1.8" fill="#9AA2AE">CONV</text>
    <text x="58" y="188" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="12" fill="#646C79">64f</text>
  </g>

  <g transform="translate(476 375)">
