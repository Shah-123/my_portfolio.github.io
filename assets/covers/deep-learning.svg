      <rect x="14" y="-76" width="66" height="172" rx="4"/>
      <rect x="28" y="-66" width="66" height="172" rx="4" fill="#171C23"/>
    </g>
    <text x="47" y="132" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" letter-spacing="1.8" fill="#9AA2AE">POOL</text>
    <text x="47" y="156" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="12" fill="#646C79">128f</text>
  </g>

  <g transform="translate(628 375)">
