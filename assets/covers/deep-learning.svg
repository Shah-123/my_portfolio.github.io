<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Convolutional network: stacked feature-map volumes narrowing into a dense classifier">
  <defs>
    <linearGradient id="dl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131519"/>
      <stop offset="1" stop-color="#08090B"/>
    </linearGradient>
    <pattern id="dl-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <radialGradient id="dl-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C6A667" stop-opacity=".22"/>
      <stop offset="1" stop-color="#C6A667" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#dl-bg)"/>
  <rect width="1200" height="750" fill="url(#dl-grid)"/>
  <circle cx="580" cy="375" r="340" fill="url(#dl-glow)"/>

  <g stroke="#33363D" stroke-opacity=".8" stroke-width="1">
    <path d="M228 375 H 300" /><path d="M420 375 H 476" /><path d="M572 375 H 628" /><path d="M708 375 H 764" />
  </g>

  <g transform="translate(96 375)">
    <g fill="#1B1D22" stroke="#3A3D44">
      <rect x="0" y="-150" width="112" height="300" rx="4"/>
      <rect x="14" y="-140" width="112" height="300" rx="4"/>
      <rect x="28" y="-130" width="112" height="300" rx="4" fill="#212429"/>
    </g>
    <text x="70" y="196" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" letter-spacing="1.8" fill="#9BA0A9">INPUT</text>
    <text x="70" y="220" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="12" fill="#6E7076">224²×3</text>
  </g>

  <g transform="translate(300 375)">
    <g fill="#1B1D22" stroke="#3A3D44">
      <rect x="0" y="-118" width="88" height="236" rx="4"/>
      <rect x="14" y="-108" width="88" height="236" rx="4"/>
      <rect x="28" y="-98" width="88" height="236" rx="4" fill="#212429"/>
    </g>
    <text x="58" y="164" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" letter-spacing="1.8" fill="#9BA0A9">CONV</text>
    <text x="58" y="188" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="12" fill="#6E7076">64f</text>
  </g>

  <g transform="translate(476 375)">
    <g fill="#1B1D22" stroke="#3A3D44">
      <rect x="0" y="-86" width="66" height="172" rx="4"/>
      <rect x="14" y="-76" width="66" height="172" rx="4"/>
      <rect x="28" y="-66" width="66" height="172" rx="4" fill="#212429"/>
    </g>
    <text x="47" y="132" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" letter-spacing="1.8" fill="#9BA0A9">POOL</text>
    <text x="47" y="156" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="12" fill="#6E7076">128f</text>
  </g>

  <g transform="translate(628 375)">
    <g fill="#1B1D22" stroke="#C6A667" stroke-opacity=".55">
      <rect x="0" y="-58" width="48" height="116" rx="4"/>
      <rect x="14" y="-48" width="48" height="116" rx="4"/>
      <rect x="28" y="-38" width="48" height="116" rx="4" fill="#22201B"/>
    </g>
    <text x="38" y="104" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" letter-spacing="1.8" fill="#C6A667">CONV</text>
    <text x="38" y="128" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="12" fill="#6E7076">256f</text>
  </g>

  <g transform="translate(800 375)">
    <g stroke="#33363D" stroke-width="1" stroke-opacity=".7">
      <path d="M0 -108 L 120 -54"/><path d="M0 -108 L 120 0"/><path d="M0 -108 L 120 54"/>
      <path d="M0 -36 L 120 -54"/><path d="M0 -36 L 120 0"/><path d="M0 -36 L 120 54"/>
      <path d="M0 36 L 120 -54"/><path d="M0 36 L 120 0"/><path d="M0 36 L 120 54"/>
      <path d="M0 108 L 120 -54"/><path d="M0 108 L 120 0"/><path d="M0 108 L 120 54"/>
    </g>
    <g fill="#212429" stroke="#4A4D55">
      <circle cx="0" cy="-108" r="13"/><circle cx="0" cy="-36" r="13"/>
      <circle cx="0" cy="36" r="13"/><circle cx="0" cy="108" r="13"/>
    </g>
    <g fill="#212429" stroke="#4A4D55">
      <circle cx="120" cy="-54" r="13"/><circle cx="120" cy="54" r="13"/>
    </g>
    <circle cx="120" cy="0" r="13" fill="#C6A667"/>
    <text x="60" y="176" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" letter-spacing="1.8" fill="#9BA0A9">DENSE · SOFTMAX</text>
  </g>

  <g font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" letter-spacing="2.4" fill="#6E7076">
    <text x="56" y="76">CNN · RNN · TRANSFER LEARNING</text>
    <text x="1144" y="702" text-anchor="end">TENSORFLOW · KERAS</text>
  </g>
