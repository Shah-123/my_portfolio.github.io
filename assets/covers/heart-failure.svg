<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="ECG trace above a clinical risk gauge and feature readouts">
  <defs>
    <linearGradient id="hf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1116"/>
      <stop offset="1" stop-color="#06070A"/>
    </linearGradient>
    <pattern id="hf-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <radialGradient id="hf-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2EE6A8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#2EE6A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hf-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EE6A8" stop-opacity=".15"/>
      <stop offset="1" stop-color="#2EE6A8" stop-opacity=".95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#hf-bg)"/>
  <rect width="1200" height="750" fill="url(#hf-grid)"/>
  <circle cx="600" cy="300" r="340" fill="url(#hf-glow)"/>

  <g transform="translate(96 140)">
    <text x="0" y="-24" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" letter-spacing="2.4" fill="#646C79">ECG · LEAD II</text>
    <path d="M0 120 H 90 l 18 -14 l 14 28 l 16 -140 l 18 190 l 16 -64 H 250 q 26 0 34 -26 q 8 -26 30 -26 H 380
             H 470 l 18 -14 l 14 28 l 16 -140 l 18 190 l 16 -64 H 630 q 26 0 34 -26 q 8 -26 30 -26 H 760
             H 850 l 18 -14 l 14 28 l 16 -140 l 18 190 l 16 -64 H 1010"
          fill="none" stroke="url(#hf-fade)" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <g transform="translate(150 400)" font-family="ui-monospace,'JetBrains Mono',monospace">
    <text x="0" y="0" font-size="13" letter-spacing="2.4" fill="#646C79">FEATURES</text>
    <g font-size="15">
      <text x="0" y="44" fill="#9AA2AE">ejection_fraction</text>
      <rect x="0" y="56" width="300" height="6" rx="3" fill="#1B2129"/>
      <rect x="0" y="56" width="222" height="6" rx="3" fill="#2EE6A8"/>
      <text x="0" y="106" fill="#9AA2AE">serum_creatinine</text>
      <rect x="0" y="118" width="300" height="6" rx="3" fill="#1B2129"/>
      <rect x="0" y="118" width="186" height="6" rx="3" fill="#2EE6A8" fill-opacity=".8"/>
      <text x="0" y="168" fill="#9AA2AE">age</text>
      <rect x="0" y="180" width="300" height="6" rx="3" fill="#1B2129"/>
      <rect x="0" y="180" width="138" height="6" rx="3" fill="#565F6C"/>
      <text x="0" y="230" fill="#9AA2AE">time</text>
      <rect x="0" y="242" width="300" height="6" rx="3" fill="#1B2129"/>
      <rect x="0" y="242" width="96" height="6" rx="3" fill="#565F6C"/>
    </g>
  </g>

  <g transform="translate(760 470)">
    <path d="M-160 0 A 160 160 0 0 1 160 0" fill="none" stroke="#1B2129" stroke-width="22" stroke-linecap="round"/>
    <path d="M-160 0 A 160 160 0 0 1 96 -128" fill="none" stroke="#2EE6A8" stroke-width="22" stroke-linecap="round"/>
    <text x="0" y="-42" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="52" fill="#E9EBEE">68%</text>
    <text x="0" y="-8" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" letter-spacing="2.4" fill="#2EE6A8">RISK SCORE</text>
    <g font-family="ui-monospace,'JetBrains Mono',monospace" font-size="12" fill="#646C79">
      <text x="-160" y="32" text-anchor="middle">LOW</text>
      <text x="160" y="32" text-anchor="middle">HIGH</text>
    </g>
  </g>

  <g font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" letter-spacing="2.4" fill="#646C79">
    <text x="56" y="76">CLINICAL RISK CLASSIFIER</text>
    <text x="1144" y="702" text-anchor="end">HEALTHCARE ML</text>
  </g>
</svg>
