<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Chess board with a candidate move vector and a position evaluation bar">
    <style>
    @keyframes dashflow { to { stroke-dashoffset: -40; } }
    @keyframes pulse { 0%,100% { opacity:.16 } 50% { opacity:.5 } }
    @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:.3 } }
    @keyframes bar { 0%,100% { transform:scaleY(.55) } 50% { transform:scaleY(1) } }
    @keyframes glow { 0%,100% { opacity:.55 } 50% { opacity:1 } }
    @keyframes wk { 0%,100% { opacity:.72 } 50% { opacity:1 } }
    @keyframes ring { 0%,100% { opacity:.45 } 50% { opacity:1 } }
    @keyframes evals { 0%,100% { transform:scaleY(.9) } 50% { transform:scaleY(1.06) } }
    .flow { animation: dashflow 1.5s linear infinite; }
    .flow-slow { animation: dashflow 3s linear infinite; }
    .pulse { animation: pulse 3.6s ease-in-out infinite; }
    .blink { animation: blink 2.2s ease-in-out infinite; }
    .glow { animation: glow 2.8s ease-in-out infinite; }
    .wk { animation: wk 3s ease-in-out infinite; }
    .ring { animation: ring 4.2s ease-in-out infinite; }
    .bar { transform-box: fill-box; transform-origin: center; animation: bar 1.9s ease-in-out infinite; }
    .evalbar { transform-box: fill-box; transform-origin: top center; animation: evals 4.5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="ch-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1116"/>
      <stop offset="1" stop-color="#06070A"/>
    </linearGradient>
    <pattern id="ch-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <radialGradient id="ch-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2EE6A8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2EE6A8" stop-opacity="0"/>
    </radialGradient>
    <marker id="ch-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#2EE6A8"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="url(#ch-bg)"/>
  <rect width="1200" height="750" fill="url(#ch-grid)"/>
  <circle cx="430" cy="375" r="330" fill="url(#ch-glow)"/>

  <g transform="translate(140 135)">
    <rect x="-1" y="-1" width="482" height="482" rx="8" fill="none" stroke="#2F3742"/>
    <g fill="#151A21">
      <rect x="0" y="0" width="60" height="60"/><rect x="120" y="0" width="60" height="60"/><rect x="240" y="0" width="60" height="60"/><rect x="360" y="0" width="60" height="60"/>
      <rect x="60" y="60" width="60" height="60"/><rect x="180" y="60" width="60" height="60"/><rect x="300" y="60" width="60" height="60"/><rect x="420" y="60" width="60" height="60"/>
      <rect x="0" y="120" width="60" height="60"/><rect x="120" y="120" width="60" height="60"/><rect x="240" y="120" width="60" height="60"/><rect x="360" y="120" width="60" height="60"/>
      <rect x="60" y="180" width="60" height="60"/><rect x="180" y="180" width="60" height="60"/><rect x="300" y="180" width="60" height="60"/><rect x="420" y="180" width="60" height="60"/>
      <rect x="0" y="240" width="60" height="60"/><rect x="120" y="240" width="60" height="60"/><rect x="240" y="240" width="60" height="60"/><rect x="360" y="240" width="60" height="60"/>
      <rect x="60" y="300" width="60" height="60"/><rect x="180" y="300" width="60" height="60"/><rect x="300" y="300" width="60" height="60"/><rect x="420" y="300" width="60" height="60"/>
      <rect x="0" y="360" width="60" height="60"/><rect x="120" y="360" width="60" height="60"/><rect x="240" y="360" width="60" height="60"/><rect x="360" y="360" width="60" height="60"/>
      <rect x="60" y="420" width="60" height="60"/><rect x="180" y="420" width="60" height="60"/><rect x="300" y="420" width="60" height="60"/><rect x="420" y="420" width="60" height="60"/>
    </g>
    <rect class="pulse" x="180" y="300" width="60" height="60" fill="#2EE6A8" fill-opacity=".16"/>
    <rect class="glow" x="240" y="180" width="60" height="60" fill="#2EE6A8" fill-opacity=".28" stroke="#2EE6A8" stroke-opacity=".6"/>
    <path class="flow" d="M210 330 L 210 240 L 258 210" fill="none" stroke="#2EE6A8" stroke-width="2.5" stroke-dasharray="4 6" marker-end="url(#ch-ar)"/>
    <circle cx="210" cy="330" r="9" fill="#2EE6A8"/>
  </g>

  <g transform="translate(700 135)">
    <text x="0" y="-24" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" letter-spacing="2.4" fill="#646C79">EVALUATION</text>
    <rect x="0" y="0" width="26" height="480" rx="6" fill="#151A21" stroke="#2A313B"/>
    <rect class="evalbar" x="0" y="0" width="26" height="186" rx="6" fill="#E9EBEE" fill-opacity=".82"/>
    <line x1="-10" y1="186" x2="36" y2="186" stroke="#2EE6A8" stroke-width="2"/>
    <text x="50" y="192" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="20" fill="#E9EBEE">+1.4</text>
  </g>

  <g transform="translate(830 152)" font-family="ui-monospace,'JetBrains Mono',monospace">
    <rect x="0" y="0" width="230" height="446" rx="12" fill="#0A0C10" stroke="#2A313B"/>
    <text x="24" y="42" font-size="13" letter-spacing="2.4" fill="#2EE6A8">AGENT · ANALYSIS</text>
    <g font-size="15" fill="#E9EBEE">
      <text x="24" y="94">1. Nf3-e5</text>
      <text x="24" y="130">2. d4</text>
      <text x="24" y="166">3. Bxc4</text>
    </g>
    <g fill="#2F3742">
      <rect class="wk" x="24" y="200" width="182" height="7" rx="3.5"/>
      <rect class="wk" style="animation-delay:.5s" x="24" y="220" width="150" height="7" rx="3.5"/>
      <rect class="wk" style="animation-delay:1s" x="24" y="240" width="168" height="7" rx="3.5"/>
      <rect class="wk" style="animation-delay:1.5s" x="24" y="260" width="120" height="7" rx="3.5"/>
    </g>
    <line x1="24" y1="298" x2="206" y2="298" stroke="#2A313B"/>
    <g font-size="13" fill="#646C79">
      <text x="24" y="332">depth</text><text x="206" y="332" text-anchor="end" fill="#E9EBEE">18</text>
      <text x="24" y="366">nodes</text><text x="206" y="366" text-anchor="end" fill="#E9EBEE">2.1M</text>
      <text x="24" y="400">tactic</text><text x="206" y="400" text-anchor="end" fill="#2EE6A8">fork</text>
    </g>
  </g>

  <g font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" letter-spacing="2.4" fill="#646C79">
    <text x="56" y="76">LLM + ENGINE</text>
    <text x="1144" y="702" text-anchor="end">POSITION ANALYSIS</text>
  </g>
</svg>
