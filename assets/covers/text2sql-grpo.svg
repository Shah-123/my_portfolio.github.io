<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="GRPO loop: a policy model samples a group of SQL queries, each is executed against SQLite, and execution-matched rewards flow back to the policy">
  <defs>
    <linearGradient id="ts-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141312"/>
      <stop offset="1" stop-color="#0D0D0C"/>
    </linearGradient>
    <pattern id="ts-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <radialGradient id="ts-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C4A484" stop-opacity=".26"/>
      <stop offset="1" stop-color="#C4A484" stop-opacity="0"/>
    </radialGradient>
    <marker id="ts-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#605B55"/>
    </marker>
    <marker id="ts-arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#C4A484"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="url(#ts-bg)"/>
  <rect width="1200" height="750" fill="url(#ts-grid)"/>
  <circle cx="400" cy="375" r="300" fill="url(#ts-glow)"/>

  <!-- question → policy → group of SQL candidates → executor → reward -->
  <g stroke="#605B55" stroke-opacity=".55" stroke-width="1.5" fill="none" marker-end="url(#ts-ar)">
    <path d="M222 375 L 318 375"/>
    <path d="M474 360 C 520 330, 530 230, 578 226"/>
    <path d="M478 368 C 520 360, 540 318, 578 314"/>
    <path d="M478 382 C 520 390, 540 432, 578 436"/>
    <path d="M474 390 C 520 420, 530 520, 578 524"/>
    <path d="M730 226 C 780 226, 790 350, 836 366"/>
    <path d="M730 314 C 780 314, 800 360, 836 370"/>
    <path d="M730 436 C 780 436, 800 390, 836 380"/>
    <path d="M730 524 C 780 524, 790 400, 836 384"/>
    <path d="M988 375 L 1036 375"/>
  </g>
  <!-- reward flows back to the policy -->
  <path d="M1096 404 C 1096 640, 420 660, 400 462" fill="none" stroke="#C4A484" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#ts-arg)"/>

  <g font-family="ui-monospace,'JetBrains Mono',monospace" font-size="15" letter-spacing="1.4" text-anchor="middle">
    <rect x="90" y="349" width="132" height="52" rx="8" fill="#191816" stroke="#2E2B28"/>
    <rect x="578" y="204" width="152" height="44" rx="8" fill="#191816" stroke="#2E2B28"/>
    <rect x="578" y="292" width="152" height="44" rx="8" fill="#191816" stroke="#C4A484" stroke-opacity=".6"/>
    <rect x="578" y="414" width="152" height="44" rx="8" fill="#191816" stroke="#2E2B28"/>
    <rect x="578" y="502" width="152" height="44" rx="8" fill="#191816" stroke="#C4A484" stroke-opacity=".6"/>
    <rect x="836" y="349" width="152" height="52" rx="8" fill="#191816" stroke="#2E2B28"/>
    <rect x="1036" y="349" width="120" height="52" rx="8" fill="#191816" stroke="#2E2B28"/>

    <text x="156" y="381" fill="#A8A29A">QUESTION</text>
    <text x="640" y="231" fill="#A8A29A">SELECT …</text>
    <text x="640" y="319" fill="#EEEAE3">SELECT …</text>
    <text x="640" y="441" fill="#A8A29A">SELECT …</text>
    <text x="640" y="529" fill="#EEEAE3">SELECT …</text>
    <text x="912" y="381" fill="#EEEAE3">SQLITE EXEC</text>
    <text x="1096" y="381" fill="#EEEAE3">REWARD</text>
  </g>

  <!-- per-candidate execution match -->
  <g font-family="ui-monospace,'JetBrains Mono',monospace" font-size="16" text-anchor="middle">
    <text x="704" y="232" fill="#6F6A63">✕</text>
    <text x="704" y="320" fill="#C4A484">✓</text>
    <text x="704" y="442" fill="#6F6A63">✕</text>
    <text x="704" y="530" fill="#C4A484">✓</text>
  </g>

  <circle cx="400" cy="375" r="78" fill="#111110" stroke="#C4A484" stroke-width="1.5"/>
  <circle cx="400" cy="375" r="96" fill="none" stroke="#C4A484" stroke-opacity=".22" stroke-width="1"/>
  <text x="400" y="368" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="17" letter-spacing="1.6" fill="#EEEAE3">POLICY</text>
  <text x="400" y="392" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="12" letter-spacing="1.2" fill="#C4A484">qwen2.5-coder-3b</text>
  <text x="400" y="410" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="11" letter-spacing="1.2" fill="#6F6A63">+ lora</text>

  <g font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" letter-spacing="2.4" fill="#6F6A63">
    <text x="56" y="76">GRPO · EXECUTION-VERIFIED REWARDS</text>
    <text x="640" y="176" text-anchor="middle">GROUP OF G SAMPLES</text>
    <text x="760" y="654" text-anchor="middle" fill="#C4A484" fill-opacity=".7">GROUP-RELATIVE ADVANTAGE</text>
    <text x="56" y="702">SPIDER 64.5 → 67.6</text>
    <text x="1144" y="702" text-anchor="end">BIRD MINI-DEV 32.6 → 38.2</text>
  </g>
</svg>
