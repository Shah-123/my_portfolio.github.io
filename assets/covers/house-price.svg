      <rect x="0" y="98" width="252" height="8" rx="4" fill="#1B2129"/><rect x="0" y="98" width="190" height="8" rx="4" fill="#2EE6A8" fill-opacity=".75"/>
      <text x="0" y="140" fill="#9AA2AE">grade</text>
      <rect x="0" y="150" width="252" height="8" rx="4" fill="#1B2129"/><rect x="0" y="150" width="140" height="8" rx="4" fill="#565F6C"/>
      <text x="0" y="192" fill="#9AA2AE">yr_built</text>
      <rect x="0" y="202" width="252" height="8" rx="4" fill="#1B2129"/><rect x="0" y="202" width="84" height="8" rx="4" fill="#3A434F"/>
