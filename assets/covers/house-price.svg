      <rect x="0" y="150" width="252" height="8" rx="4" fill="#26292F"/><rect x="0" y="150" width="140" height="8" rx="4" fill="#7C808A"/>
      <text x="0" y="192" fill="#9BA0A9">yr_built</text>
      <rect x="0" y="202" width="252" height="8" rx="4" fill="#26292F"/><rect x="0" y="202" width="84" height="8" rx="4" fill="#4A4D55"/>
