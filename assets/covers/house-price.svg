<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Ensemble of decision trees producing a price estimate with feature importances">
  <defs>
    <linearGradient id="hp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1116"/>
      <stop offset="1" stop-color="#06070A"/>
    </linearGradient>
    <pattern id="hp-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <radialGradient id="hp-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2EE6A8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#2EE6A8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#hp-bg)"/>
  <rect width="1200" height="750" fill="url(#hp-grid)"/>
  <circle cx="560" cy="360" r="340" fill="url(#hp-glow)"/>

  <g transform="translate(96 150)">
