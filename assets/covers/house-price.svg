    <g stroke="#2F3742" stroke-width="1.4" fill="none">
      <g transform="translate(0 0)">
        <path d="M110 20 L 60 88 M110 20 L 160 88 M60 88 L 30 156 M60 88 L 90 156 M160 88 L 130 156 M160 88 L 190 156"/>
      </g>
      <g transform="translate(240 0)">
        <path d="M110 20 L 60 88 M110 20 L 160 88 M60 88 L 30 156 M60 88 L 90 156 M160 88 L 130 156 M160 88 L 190 156"/>
      </g>
      <g transform="translate(480 0)">
        <path d="M110 20 L 60 88 M110 20 L 160 88 M60 88 L 30 156 M60 88 L 90 156 M160 88 L 130 156 M160 88 L 190 156"/>
      </g>
    </g>
    <g fill="#171C23" stroke="#3A434F">
      <g><circle cx="110" cy="20" r="11"/><circle cx="60" cy="88" r="9"/><circle cx="160" cy="88" r="9"/><circle cx="30" cy="156" r="8"/><circle cx="90" cy="156" r="8"/><circle cx="130" cy="156" r="8"/><circle cx="190" cy="156" r="8"/></g>
      <g transform="translate(240 0)"><circle cx="110" cy="20" r="11"/><circle cx="60" cy="88" r="9"/><circle cx="160" cy="88" r="9"/><circle cx="30" cy="156" r="8"/><circle cx="90" cy="156" r="8"/><circle cx="130" cy="156" r="8"/><circle cx="190" cy="156" r="8"/></g>
      <g transform="translate(480 0)"><circle cx="110" cy="20" r="11"/><circle cx="60" cy="88" r="9"/><circle cx="160" cy="88" r="9"/><circle cx="30" cy="156" r="8"/><circle cx="90" cy="156" r="8"/><circle cx="130" cy="156" r="8"/><circle cx="190" cy="156" r="8"/></g>
    </g>
    <g fill="#2EE6A8">
      <circle cx="90" cy="156" r="8"/><circle cx="370" cy="156" r="8"/><circle cx="670" cy="156" r="8"/>
    </g>
    <g stroke="#2EE6A8" stroke-opacity=".45" stroke-width="1.4" stroke-dasharray="5 6" fill="none">
      <path d="M90 168 C 90 240, 340 230, 380 246"/>
      <path d="M370 168 C 370 220, 380 226, 388 246"/>
      <path d="M670 168 C 670 240, 430 230, 396 246"/>
    </g>
  </g>

  <g transform="translate(388 420)" font-family="ui-monospace,'JetBrains Mono',monospace">
    <rect x="-192" y="0" width="384" height="132" rx="12" fill="#0A0C10" stroke="#2EE6A8" stroke-opacity=".5"/>
    <text x="0" y="36" text-anchor="middle" font-size="12" letter-spacing="2.2" fill="#2EE6A8">PREDICTED PRICE</text>
    <text x="0" y="90" text-anchor="middle" font-size="44" fill="#E9EBEE">$412,900</text>
    <text x="0" y="116" text-anchor="middle" font-size="12" fill="#646C79">MAE $11.2K · r² 0.91</text>
  </g>

  <g transform="translate(852 420)" font-family="ui-monospace,'JetBrains Mono',monospace">
